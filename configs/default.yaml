run_name: default

storage_path: /data/dust/user/dayhallh/eas/data/

showers:
  folder: PDG22
  subfolders: [e1e5_0,
               e1e6_0,
               e1e7_0,
               ]


subshowers:
  # One set of subshowers is made for each shower and energy cut, saved in
  # the shower's folder as subshowers_e<cut>.h5 (with a .yaml of settings).

  # Showers to split, inside the showers folder above. Leave this out to
  # split every shower listed in the showers section.
  # subfolders: [e1e5_0]

  # A subshower starts at the first particle down each branch with kinetic
  # energy below the cut, in GeV. Write large cuts out in full, or with a
  # sign in the exponent (1.0e+4), as yaml reads 1e4 as text.
  energy_cuts: [100, 500, 900]

  # true keeps only the leaves of each subshower, which is what the
  # detector sampler expects; false keeps every particle in the subshower.
  leaves_only: true


detectors:
  # The detector array the subshowers are sampled with, for example by
  # scripts/plot_observables_from_config.py. name is one of the generate_
  # functions in subshowers/detector.py, and the other keys are its arguments.
  generator:
    name: generate_at_ground
    total: 20
    distance_from_center: 1000.0
    mean_width: 1.0
    std_width: 1.0
    # this array is random; with a seed it's the same array every time
    seed: 0

  # The Pierre Auger surface detector instead. for_array is stop (stations
  # still running), sd1500 or sd750; leave it out for every station listed,
  # including some since replaced at the same place.
  # generator:
  #   name: generate_pierre_auger
  #   for_array: stop


ground:
  # What reaches the ground, for the ground-level observables plotted by
  # scripts/plot_observables_from_config.py (see subshowers/ground.py). The
  # whole section can be left out; these are the defaults.

  # Height of the ground, in the history's coordinates (m), where z = 0 is
  # CORSIKA's observation level. Leaves are carried down to it in straight
  # lines. Left out, it's the height of the detectors above (the median, if
  # they're at different heights), so what reaches the ground is what
  # reaches the detectors' level. Particles that hit a detector are always
  # placed where they hit it, at that detector's height.
  # height: 0.0

  # Particles below these kinetic energies (GeV) aren't counted. CORSIKA 8
  # writes particles to the history before cutting them, and these are the
  # cuts c8_air_shower_with_history makes by default (--emcut, --mucut,
  # --hadcut).
  min_kinetic_energy:
    electrons: 5.0e-4
    photons: 5.0e-4
    muons: 0.3
    hadrons: 0.3

  # Distance (m) from the axis at which readings are taken, like the
  # Telescope Array's S800 (800 m from the shower's axis): about each
  # subshower's own axis, and about the shower's.
  reference_distance:
    subshower: 100.0
    shower: 800.0

